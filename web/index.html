<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Trupt Enterprise - Premium Wholesale Solutions">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trupt Enterprise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Trupt Enterprise</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style id="splash-screen-style">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1E3A8A 0%, #0F172A 100%);
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6),
                  0 0 50px rgba(59, 130, 246, 0.15);
      max-width: 320px;
      width: 80%;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-wrapper {
      position: relative;
      width: 159px;
      height: 110px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: #2C2E33;
      padding: 3px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(56, 189, 248, 0.25);
    }

    /* Rotating background gradient border effect */
    .logo-wrapper::before {
      content: '';
      position: absolute;
      width: 250px;
      height: 250px;
      background: conic-gradient(#38BDF8, #3B82F6, #6366F1, #38BDF8);
      animation: rotateGlow 4s linear infinite;
      z-index: 1;
    }

    .logo-wrapper::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: #2C2E33;
      border-radius: 13px;
      z-index: 1;
    }

    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 13px;
      z-index: 2;
      animation: heartbeat 2.5s infinite ease-in-out;
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 0 6px 0;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .subtitle {
      font-size: 13px;
      font-weight: 700;
      color: #38BDF8; /* Neon Sky Blue */
      margin: 0 0 24px 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Progress bar container */
    .progress-bar-container {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #38BDF8, #3B82F6, #6366F1);
      border-radius: 10px;
      position: absolute;
      animation: loadingAnim 2s infinite ease-in-out;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes loadingAnim {
      0% { left: -45%; width: 35%; }
      50% { width: 60%; }
      100% { left: 110%; width: 35%; }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(24px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-wrapper">
      <img class="logo-img" src="favicon.png?v=1.0.2" alt="Trupt Enterprise Logo">
    </div>
    <h1 class="title">Trupt Enterprise</h1>
    <p class="subtitle">Har Boond Mein Trupti</p>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
  </div>
  
  <script src="flutter_bootstrap.js?v=1.0.1" async=""></script>
</body></html>
