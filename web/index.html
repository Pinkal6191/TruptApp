<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Trupt Enterprise - Premium Packaged Drinking Water Bottles">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trupt Enterprise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Trupt Enterprise</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style id="splash-screen-style">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1E3A8A 0%, #0F172A 100%);
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6),
                  0 0 50px rgba(59, 130, 246, 0.15);
      max-width: 320px;
      width: 80%;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-wrapper {
      position: relative;
      width: 159px;
      height: 110px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: #2C2E33;
      padding: 3px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(56, 189, 248, 0.25);
    }

    /* Rotating background gradient border effect */
    .logo-wrapper::before {
      content: '';
      position: absolute;
      width: 250px;
      height: 250px;
      background: conic-gradient(#38BDF8, #3B82F6, #6366F1, #38BDF8);
      animation: rotateGlow 4s linear infinite;
      z-index: 1;
    }

    .logo-wrapper::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: #2C2E33;
      border-radius: 13px;
      z-index: 1;
    }

    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 13px;
      z-index: 2;
      animation: heartbeat 2.5s infinite ease-in-out;
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 0 6px 0;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .subtitle {
      font-size: 13px;
      font-weight: 700;
      color: #38BDF8; /* Neon Sky Blue */
      margin: 0 0 24px 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Progress bar container */
    .progress-bar-container {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #38BDF8, #3B82F6, #6366F1);
      border-radius: 10px;
      position: absolute;
      animation: loadingAnim 2s infinite ease-in-out;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes loadingAnim {
      0% { left: -45%; width: 35%; }
      50% { width: 60%; }
      100% { left: 110%; width: 35%; }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(24px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Premium Glassmorphism Update Banner */
    #update-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      width: 90%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.75); /* Deep slate with opacity */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.35); /* Neon sky-blue glow border */
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6),
                  0 0 30px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 999999;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
      opacity: 0;
      box-sizing: border-box;
    }

    #update-banner.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .update-content {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .update-icon {
      width: 42px;
      height: 42px;
      background: rgba(56, 189, 248, 0.12);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38BDF8;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .update-icon svg {
      animation: rotateSync 6s linear infinite;
    }

    @keyframes rotateSync {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    .update-text {
      flex-grow: 1;
      text-align: left;
      font-family: 'Outfit', 'Inter', sans-serif;
    }

    .update-title {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      margin: 0 0 3px 0;
      letter-spacing: 0.3px;
    }

    .update-desc {
      font-size: 12px;
      color: #94A3B8; /* Slate 400 */
      margin: 0;
      line-height: 1.4;
    }

    .update-action-btn {
      width: 100%;
      background: linear-gradient(135deg, #38BDF8 0%, #3B82F6 100%);
      border: none;
      border-radius: 12px;
      color: #FFFFFF;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Outfit', 'Inter', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .update-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
    }

    .update-action-btn:active {
      transform: translateY(1px);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-wrapper">
      <img class="logo-img" src="favicon.png?v=1.0.2" alt="Trupt Enterprise Logo">
    </div>
    <h1 class="title">Trupt Enterprise</h1>
    <p class="subtitle">Har Boond Mein Trupti</p>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- Beautiful Premium Update Banner -->
  <div id="update-banner">
    <div class="update-content">
      <div class="update-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </div>
      <div class="update-text">
        <h4 class="update-title">New Update Available</h4>
        <p class="update-desc">A fresh version is ready. Tap to refresh and load the latest features instantly!</p>
      </div>
    </div>
    <button class="update-action-btn" onclick="window.triggerAppUpdate()">
      Refresh App Now
    </button>
  </div>

  <script>
    (function() {
      // The actual built version injected during compilation
      const RUNNING_VERSION = "{{APP_VERSION}}";

      // Fetch the version.json file with a cache buster
      async function checkVersion(isInitial = false) {
        try {
          const cacheBuster = new Date().getTime();
          const response = await fetch('version.json?cb=' + cacheBuster, {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache'
            }
          });
          if (!response.ok) return;
          const data = await response.json();
          const serverVersion = data.version + '+' + data.build_number;

          const loadedVersion = RUNNING_VERSION.startsWith('{{') ? '1.0.1+13' : RUNNING_VERSION;
          console.log('[App Version] Check - Running:', loadedVersion, 'Server:', serverVersion);

          if (loadedVersion !== serverVersion) {
            console.log('[App Version] Update detected! Showing update banner.');
            showUpdateBanner();
          }
        } catch (e) {
          console.warn('Error checking app version:', e);
        }
      }

      function showUpdateBanner() {
        const banner = document.getElementById('update-banner');
        if (banner && !banner.classList.contains('show')) {
          banner.classList.add('show');
        }
      }

      window.triggerAppUpdate = async function() {
        const btn = document.querySelector('.update-action-btn');
        if (btn) {
          btn.innerHTML = '<span class="spinner"></span> Updating application...';
          btn.disabled = true;
        }
        
        console.log('[App Version] Triggering full update refresh...');
        try {
          // Unregister all service workers to ensure we clean slate
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
              await registration.unregister();
              console.log('[App Version] Unregistered service worker:', registration.scope);
            }
          }
          
          // Clear standard caches if supported
          if ('caches' in window) {
            const keys = await caches.keys();
            for (let key of keys) {
              await caches.delete(key);
              console.log('[App Version] Cleared cache storage:', key);
            }
          }
        } catch (e) {
          console.warn('Error clearing service workers/caches:', e);
        }

        // Hard reload from server
        console.log('[App Version] Hard-reloading page...');
        const currentUrl = window.location.href.split('?')[0];
        window.location.href = currentUrl + '?v=' + new Date().getTime();
      };

      // Run check on startup
      checkVersion(true);

      // Check again whenever PWA is brought to foreground (visibilitychange/focus)
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          console.log('[App Version] Visibility changed to visible. Checking for updates...');
          checkVersion(false);
        }
      });

      window.addEventListener('focus', function() {
        console.log('[App Version] Window focused. Checking for updates...');
        checkVersion(false);
      });

      // Also check periodically every 60 seconds
      setInterval(function() {
        console.log('[App Version] Periodic check running...');
        checkVersion(false);
      }, 60000);

      // Dynamic loading of flutter_bootstrap.js with cache-busting version query parameter
      const loadedVersion = RUNNING_VERSION.startsWith('{{') ? '1.0.1+13' : RUNNING_VERSION;
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(loadedVersion);
      script.async = true;
      document.body.appendChild(script);

      // Remove the splash screen once Flutter has loaded the DOM elements
      const observer = new MutationObserver(function(mutations) {
        for (let mutation of mutations) {
          for (let node of mutation.addedNodes) {
            if (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'FLT-GLASS-PANE') {
              setTimeout(() => {
                const loader = document.getElementById('loading-container');
                if (loader) loader.remove();
                
                // Set body background to match app background to prevent dark gaps on keyboard hide
                document.body.style.background = '#F5F7FA';
              }, 500);
              observer.disconnect();
              return;
            }
          }
        }
      });
      observer.observe(document.body, { childList: true });
    })();
  </script>
</body></html>
